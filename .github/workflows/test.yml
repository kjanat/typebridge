name: Test
on:
  workflow_call:
    inputs:
      ref: { type: string, default: "" }
  push:
    branches: [master]
  pull_request:
permissions: { contents: read }
concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { shell: "bash -euo pipefail {0}" } }
jobs:
  build:
    uses: $/.github/workflows/build.yml
    with: { ref: "${{ inputs.ref }}" }
  test:
    name: test
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful package jobs
        env: { BUILD_RESULTS: "${{ toJSON(needs) }}" }
        run: jq -e 'all(.[]; .result == "success")' <<< "${BUILD_RESULTS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.work, cache-dependency-path: "*/go.sum" }
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "package-*", merge-multiple: true, path: artifacts }
      - name: Restore package builds
        working-directory: artifacts
        run: |
          sha256sum -c ./*.sha256
          for archive in ./*.tgz; do
            workspace=$(basename "${archive}" .tgz)
            tar -xzf "${archive}" --strip-components=1 -C "../${workspace}"
          done
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - uses: kjanat/dprint-check@29c42153a7346f4d7315883ff7722cfe22cd510c # v3
  consumer:
    name: Installed packages (${{ matrix.runtime }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix: { runtime: [node, bun] }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ inputs.ref || github.sha }}", persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "package-*", merge-multiple: true, path: artifacts }
      - name: Verify archive checksums
        working-directory: artifacts
        run: sha256sum -c ./*.sha256
      - name: Test an isolated installation
        env: { RUNTIME: "${{ matrix.runtime }}" }
        run: bun .github/release/verify.ts "${RUNTIME}"
