name: Test
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults: { run: { shell: "bash -euo pipefail {0}" } }
jobs:
  protocol:
    uses: $/.github/workflows/package.yml
    with: { package: protocol }
  compat:
    uses: $/.github/workflows/package.yml
    with: { package: compat }
  bridge:
    needs: [protocol]
    uses: $/.github/workflows/package.yml
    with:
      package: bridge
      dependencies: ${{ join(needs.*.outputs.artifact-id, ',') }}
  wasm:
    needs: [protocol, bridge]
    uses: $/.github/workflows/package.yml
    with:
      package: wasm
      dependencies: ${{ join(needs.*.outputs.artifact-id, ',') }}
  vue-mapper:
    needs: [protocol, compat, bridge, wasm]
    uses: $/.github/workflows/package.yml
    with:
      package: vue-mapper
      dependencies: ${{ join(needs.*.outputs.artifact-id, ',') }}
  test:
    name: test
    if: always()
    needs: [protocol, compat, bridge, wasm, vue-mapper]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful package jobs
        env: { BUILD_RESULTS: "${{ toJSON(needs) }}" }
        run: jq -e 'all(.[]; .result == "success")' <<< "${BUILD_RESULTS}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "package-*", merge-multiple: true, path: artifacts }
      - name: Restore package builds
        working-directory: artifacts
        run: |
          sha256sum -c ./*.sha256
          for archive in ./*.tgz; do
            workspace=$(basename "${archive}" .tgz)
            tar -xzf "${archive}" --strip-components=1 -C "../${workspace}"
          done
      - run: bun run typecheck:root
      - run: bun test ./test
      - run: bun run lint
      - uses: kjanat/dprint-check@29c42153a7346f4d7315883ff7722cfe22cd510c # v3
  consumer:
    name: Installed packages (${{ matrix.runtime }})
    needs: [protocol, compat, bridge, wasm, vue-mapper]
    strategy:
      fail-fast: false
      matrix: { runtime: [node, bun] }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "package-*", merge-multiple: true, path: artifacts }
      - name: Verify archive checksums
        working-directory: artifacts
        run: sha256sum -c ./*.sha256
      - name: Test an isolated installation
        env: { RUNTIME: "${{ matrix.runtime }}" }
        run: bun .github/release/verify.ts "${RUNTIME}"
  preview:
    needs: [test, consumer]
    if: github.ref_type != 'tag'
    uses: $/.github/workflows/pkg-pr-new.yml
  npm:
    needs: [test, consumer]
    if: github.event_name == 'push'
    uses: $/.github/workflows/publish.yml
    permissions: { contents: read, id-token: write }
